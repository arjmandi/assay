[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assay-harness"
description = "ASSAY, an agent harness that grounds a world model by checked prediction: predict before every action, code grades each outcome, and the record is hash-chained."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Mohsen Arjmandi"}]
dynamic = ["version"]
dependencies = ["numpy>=2,<3"]

[project.optional-dependencies]
# A frame world (grid observations) renders images; a dict world does not need pillow.
grid = ["pillow>=10,<13"]
dev = ["pytest", "ruff", "mypy", "pillow>=10,<13"]

[project.scripts]
assay = "assay.cli:main"

[project.urls]
Repository = "https://github.com/arjmandi/assay"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["assay", "assay.grid"]

[tool.setuptools.dynamic]
version = {attr = "assay.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
strict = true
warn_unused_ignores = true
python_version = "3.12"
files = ["src/assay"]
