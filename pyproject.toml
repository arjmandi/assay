[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assay-harness"
description = "ASSAY, a referee harness between an agent and a world: enforced predict-before-act, code-graded claims, hash-chained journals."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Mohsen Arjmandi"}]
dynamic = ["version"]
dependencies = [
  "numpy>=2,<3",
]

[project.optional-dependencies]
# Frame worlds (grid observations) render images; the kernel does not need pillow.
grid = ["pillow>=10,<13"]
# The ARC-AGI-3 benchmark adapter needs the arc-agi client and the grid extra.
arcagi = ["arc-agi", "pillow>=10,<13"]
# Building or fetching an OOLONG corpus pack reads a parquet shard; the adapter itself needs nothing.
oolong = ["pyarrow", "pandas"]
dev = ["pytest", "hypothesis", "ruff", "mypy"]

[project.scripts]
assay = "assay.cli:main"

[project.urls]
Homepage = "https://arjmandi.github.io/assay-site/"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["assay", "assay_grid"]

[tool.setuptools.dynamic]
version = {attr = "assay.__version__"}

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# ruff's default rule set (pyflakes and the pycodestyle errors), named so a
# build with a different default cannot move the gate; `ruff check src tests`
# must pass. Import order and line length are not enforced.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# A plain `mypy` from the repository root is the run CI makes on every cell,
# `uv run --with mypy --with numpy --with pillow mypy --strict src/assay`:
# strict over the kernel, checked as Python 3.12, the floor of
# requires-python. numpy ships its types; the kernel imports nothing else
# from outside the standard library.
strict = true
warn_unused_ignores = true
python_version = "3.12"
files = ["src/assay"]

[[tool.mypy.overrides]]
# The frame-world extra, which the kernel imports lazily by observation
# shape, is followed for its types (the kernel's calls into it are checked)
# and its own errors are not reported: it is not under the gate yet, and an
# editable install hides them anyway, since mypy treats an installed
# package's path as site-packages. This makes a checkout without the install
# agree with CI.
module = "assay_grid.*"
follow_imports = "silent"
