name: CI

# push only: with pull_request as well, every push to a branch with an open pull request ran the six-cell matrix twice, and the macOS cells bill at ten times the Linux rate.
on:
  push:

jobs:
  suite:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      # The suite spawns the real daemon and runs the launcher, which looks for
      # a python3 on PATH; setup-python puts the matrix interpreter there.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      # The pre-tag greps of RELEASE_CHECKLIST.md section 3 (world names in
      # the kernel, machine paths, the old manual name, em dashes and arrows)
      # run inside the suite as tests/test_conformance.py and
      # tests/test_hygiene.py, over git ls-files, so a new file is covered
      # the day it is added.
      # The sandbox on Linux is bubblewrap, which the runner image does not
      # ship; without it the suite runs with the process limits alone and
      # `assay doctor` warns, which tests/test_doctor.py counts.
      - name: bubblewrap, so the Linux cells run under the sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
          sysctl kernel.apparmor_restrict_unprivileged_userns
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor
      # (the runner image reports 1), and bwrap needs one for its mount
      # namespace: without the setting its probe fails with `bwrap: loopback:
      # Failed RTM_NEWADDR: Operation not permitted` and the suite runs with
      # the process limits alone.
      - name: unprivileged user namespaces, which bwrap needs
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: The sandbox mode
        run: uv run --python ${{ matrix.python }} --with numpy python -c "from assay.sandbox import sandbox_mode, sandbox_text; print('sandbox |', sandbox_text(sandbox_mode()))"
      - name: The suite
        run: uv run --python ${{ matrix.python }} --with pytest --with numpy --with pillow --with hypothesis pytest tests/ -q
      - name: ruff
        run: uv run --with ruff ruff check src tests hooks
      # Strict over the kernel, the frame-world extra and the Claude Code
      # hook script, checked as Python 3.12 (pyproject's python_version)
      # under each cell's interpreter; the same run as a plain `mypy` from
      # the root. numpy and pillow ship their types.
      - name: mypy, strict, over the kernel, the extra and the hooks
        run: uv run --python ${{ matrix.python }} --with mypy --with numpy --with pillow mypy --strict src/assay src/assay_grid hooks
      - name: The published journals against their heads
        run: python3 evidence/verify_all.py
