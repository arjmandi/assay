name: CI

on:
  push:

jobs:
  suite:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      # The suite drives the real command line and the real daemon.
      - name: The suite
        run: uv run --python ${{ matrix.python }} --with pytest --with numpy --with pillow pytest tests/ -q
      - name: ruff
        if: ${{ !cancelled() }}
        run: uv run --with ruff ruff check src tests worlds
      - name: mypy, strict, over the kernel
        if: ${{ !cancelled() }}
        run: uv run --python ${{ matrix.python }} --with mypy --with numpy --with pillow mypy --strict src/assay
